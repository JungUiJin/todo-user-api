plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

ext {
    querydslVersion = '7.7'
}

repositories {
    mavenCentral()
}

dependencies {
    // 웹 / 데이터 / 검증
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // API 문서화 (Swagger UI)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.9.1'

    // QueryDSL (Jakarta EE 대응 OpenFeign 포크 - 원본 com.querydsl 5.x는 유지보수 중단 및 CVE-2024-49203 존재)
    implementation "io.github.openfeign.querydsl:querydsl-jpa:${querydslVersion}"
    annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${querydslVersion}:jpa"
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 개발용 인메모리 DB
    runtimeOnly 'com.h2database:h2'

    // 테스트
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Q-Class 생성 위치: 어노테이션 프로세서가 build/generated/querydsl 하위에 생성하며, clean 시 함께 삭제된다.
// (srcDir로 다시 등록하면 Q-Class가 중복 컴파일되므로 등록하지 않는다. IDE는 Gradle 위임 빌드를 사용한다.)
tasks.named('compileJava', JavaCompile) {
    options.generatedSourceOutputDirectory = layout.buildDirectory.dir('generated/querydsl').get().asFile
}

tasks.named('test') {
    useJUnitPlatform()
}
